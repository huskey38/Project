<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 카페·맛집</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#d9f1f7;--sky2:#f6fbf8;--sea:#2a9db5;--sea-deep:#1c6f8a;--sea-soft:#dff3f6;
  --tang:#f58b1f;--tang-soft:#fff0dc;--leaf:#6fae6a;--stone:#6b6f73;
  --bg:#f3faf8;--card:#ffffffd9;--text:#27393f;--sub:#6a7f85;--line:#e2eeee;--heart:#ef5b73;
  --shadow:0 8px 24px rgba(42,157,181,.12);--shadow-hover:0 12px 30px rgba(42,157,181,.2);
}
@media (prefers-color-scheme:dark){:root{
  --sky1:#0f2a36;--sky2:#14262b;--sea:#4cc3d9;--sea-deep:#7fd8e8;--sea-soft:#17353d;
  --tang:#ffa24a;--tang-soft:#3a2a17;--leaf:#8fcf8a;--stone:#9aa3a8;
  --bg:#10202a;--card:#182d36d9;--text:#e6f2f3;--sub:#9ab5bb;--line:#26414a;--heart:#ff7d93;
  --shadow:0 8px 24px rgba(0,0,0,.3);--shadow-hover:0 12px 30px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--text);line-height:1.55;
  font-family:"Gowun Dodum","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--sky1) 0,var(--bg) 420px) fixed,var(--bg)}
.hero{position:relative;overflow:hidden;text-align:center;padding:48px 16px 170px;
  background:linear-gradient(180deg,#7cd0e2 0%,#bfe8ee 55%,#eaf8f3 100%)}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(180deg,#1b4d63 0%,#1d5a6b 50%,#163640 100%)}}
.hero h1{position:relative;z-index:2;margin:0 0 6px;font-size:2.1rem;color:#fff;letter-spacing:.02em;text-shadow:0 2px 12px rgba(18,90,110,.35)}
.hero p{position:relative;z-index:2;margin:0;color:#fff;opacity:.95;font-size:1rem;text-shadow:0 1px 8px rgba(18,90,110,.35)}
.hero svg.land{position:absolute;left:0;bottom:-1px;width:100%;height:170px;z-index:1}
.hareubang{position:absolute;bottom:52px;width:62px;height:104px;z-index:2;filter:drop-shadow(0 4px 4px rgba(20,60,50,.25))}
.hareubang.hl{left:6%}.hareubang.hr{right:6%;transform:scaleX(-1)}
.cloud{position:absolute;z-index:1;height:22px;width:110px;border-radius:999px;background:#ffffffb8;filter:blur(1px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:44px;height:44px;left:18px;top:-20px}.cloud::after{width:30px;height:30px;left:58px;top:-12px}
.cloud.c1{top:34px;left:10%}.cloud.c2{top:78px;right:24%;transform:scale(.7)}
@media (prefers-color-scheme:dark){.cloud{background:#ffffff26}}
@media (max-width:680px){.hareubang{width:44px;height:74px}.sun{right:6%}}
.sun{position:absolute;top:26px;right:12%;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle,#ffd78a,#ffb347);box-shadow:0 0 50px 18px rgba(255,200,110,.5);z-index:1}
main{max-width:1000px;margin:-44px auto 0;padding:0 16px 8px;position:relative;z-index:3}
.panel{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:13px 18px;border:1.5px solid var(--line);border-radius:999px;font:inherit;font-size:1rem;
  background:var(--sky2);color:var(--text);transition:.2s}
.search:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 4px var(--sea-soft)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--sky2);color:var(--text);padding:8px 18px;border-radius:999px;
  font:inherit;font-size:.93rem;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--sea);transform:translateY(-1px)}
.btn.on{background:linear-gradient(135deg,var(--sea),#5cc4d3);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(42,157,181,.3)}
.btn.fav.on{background:linear-gradient(135deg,var(--tang),#ffb55e);box-shadow:0 4px 12px rgba(245,139,31,.35)}
.btn.city.on{background:linear-gradient(135deg,#6a8fe0,#4a6fc4);box-shadow:0 4px 12px rgba(74,111,196,.3)}
.btn.sort.on{background:linear-gradient(135deg,#7fc77a,#5aa86a);box-shadow:0 4px 12px rgba(90,168,106,.3)}
.rv{font-size:.8rem;color:var(--sub)}
.btn.ghost{margin-left:auto;background:transparent}
.meta{color:var(--sub);font-size:.88rem;margin:0 8px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:680px){.grid{grid-template-columns:1fr}.hero h1{font-size:1.7rem}.btn.city.on{background:linear-gradient(135deg,#6a8fe0,#4a6fc4);box-shadow:0 4px 12px rgba(74,111,196,.3)}
.btn.sort.on{background:linear-gradient(135deg,#7fc77a,#5aa86a);box-shadow:0 4px 12px rgba(90,168,106,.3)}
.rv{font-size:.8rem;color:var(--sub)}
.btn.ghost{margin-left:0}}
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);
  transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--sea),#8fdbe6)}
.card.c-카페::before{background:linear-gradient(180deg,var(--tang),#ffcb8a)}
.card{flex-direction:row;align-items:center;gap:14px}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.art{flex:none;width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:var(--sea-soft);padding:8px}
.card.c-카페 .art{background:var(--tang-soft)}
.art svg{width:100%;height:100%;transition:transform .3s}
.card:hover .art svg{transform:scale(1.08) rotate(-3deg)}
@media (max-width:680px){.art{width:72px;height:72px;border-radius:20px;padding:6px}}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.top{display:flex;align-items:flex-start;gap:10px}
.rank{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:50%;background:var(--sea-soft);color:var(--sea-deep);
  font-weight:700;font-size:.85rem;display:grid;place-items:center}
.name{flex:1;margin:0;font-size:1.08rem;font-weight:700;word-break:break-word;padding-top:3px}
.heart{flex:none;border:0;background:var(--sky2);cursor:pointer;font-size:1.35rem;line-height:1;color:var(--sub);
  width:38px;height:38px;border-radius:50%;transition:.2s}
.heart:hover{transform:scale(1.12);color:var(--heart)}
.heart.on{color:var(--heart);background:#ffe3e8;animation:pop .35s}
@media (prefers-color-scheme:dark){.heart.on{background:#4a2530}}
@keyframes pop{50%{transform:scale(1.3)}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:.78rem;padding:3px 12px;border-radius:999px;font-weight:700}
.badge.카페{background:var(--tang-soft);color:var(--tang)}
.badge.음식점{background:var(--sea-soft);color:var(--sea-deep)}
.score{font-weight:700;color:var(--tang)}
.score small{color:var(--sub);font-weight:400}
.bar{flex:1;min-width:60px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffc36b,var(--tang))}
.desc{margin:0;color:var(--sub);font-size:.93rem}
.src{align-self:flex-start;font-size:.82rem;color:var(--sea-deep);text-decoration:none;background:var(--sea-soft);padding:4px 12px;border-radius:999px}
.src:hover{filter:brightness(.95)}
.empty{grid-column:1/-1;text-align:center;padding:48px 0;color:var(--sub)}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:24px 0;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:50%;cursor:pointer;font:inherit;transition:.2s}
.pager button:hover:not(:disabled){border-color:var(--sea)}
.pager button.on{background:linear-gradient(135deg,var(--sea),#5cc4d3);color:#fff;border-color:transparent}
.pager button:disabled{opacity:.4;cursor:default}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:8px 16px 40px}
</style>
</head>

document.getElementById('sub').textContent = DATA.region + ' · 총 ' + items.length + '곳';

const cats = ['전체', ...new Set(items.map(i => i.category))];
const btns = document.getElementById('btns');
function mkBtn(label, cls, onclick){
  const b = document.createElement('button');
  b.className = 'btn ' + (cls||''); b.textContent = label; b.onclick = onclick; return b;
}
function renderSortButtons(){
  const sb = document.getElementById('sortbtns'); sb.replaceChildren();
  Object.entries(SORTS).forEach(([k,label]) => sb.append(mkBtn((k==='score'?'★ ':'💬 ') + label, 'sort ' + (state.sort===k?'on':''), () => { state.sort=k; state.page=1; render(); })));
}
function renderCityButtons(){
  const cb = document.getElementById('citybtns'); cb.replaceChildren();
  ['전체','제주시','서귀포시'].forEach(c => {
    const n = c==='전체' ? items.length : items.filter(i=>i._city===c).length;
    cb.append(mkBtn('📍 ' + (c==='전체' ? '전체 지역' : c) + ' ' + n, 'city ' + (state.city===c?'on':''), () => { state.city=c; state.page=1; render(); }));
  });
}
function renderButtons(){
  renderCityButtons();
  renderSortButtons();
  btns.replaceChildren();
  cats.forEach(c => {
    const n = c==='전체' ? items.length : items.filter(i=>i.category===c).length;
    btns.append(mkBtn(c + ' ' + n, (state.cat===c && !state.fav) ? 'on' : '', () => { state.cat=c; state.fav=false; state.page=1; render(); }));
  });
  const fav = items.filter(i=>i.selected).length;
  btns.append(mkBtn('♥ 찜 ' + fav, 'fav ' + (state.fav?'on':''), () => { state.fav=!state.fav; state.page=1; render(); }));
}
function filtered(){
  const q = state.q.trim().toLowerCase();
  return items
    .filter(i => state.fav ? i.selected : (state.cat==='전체' || i.category===state.cat))
    .filter(i => state.city==='전체' || i._city===state.city)
    .filter(i => !q || i.name.toLowerCase().includes(q))
    .sort((a,b) => state.sort==='review'
      ? (b._rv - a._rv || b.score - a.score || a.name.localeCompare(b.name,'ko'))
      : (b.score - a.score || b._rv - a._rv || a.name.localeCompare(b.name,'ko')));
}
function card(i, rank){
  const wrap = document.createElement('article'); wrap.className = 'card c-'+i.category;
  const el = document.createElement('div'); el.className = 'body';
  const top = document.createElement('div'); top.className = 'top';
  const r = document.createElement('div'); r.className='rank'; r.textContent = rank;
  const h = document.createElement('h3'); h.className='name'; h.textContent = i.name;
  const hb = document.createElement('button');
  hb.className = 'heart' + (i.selected?' on':''); hb.textContent = i.selected ? '♥' : '♡';
  hb.title = i.selected ? '찜 해제' : '찜하기';
  hb.setAttribute('aria-pressed', i.selected);
  hb.onclick = () => { i.selected = !i.selected; render(); };
  top.append(r, h, hb);
  const row = document.createElement('div'); row.className='row';
  const bd = document.createElement('span'); bd.className='badge '+i.category; bd.textContent=i.category;
  const sc = document.createElement('span'); sc.className='score'; sc.innerHTML = i.score + '<small> / 100</small>';
  const rv = document.createElement('span'); rv.className='rv'; rv.textContent = '리뷰 ' + i._rv.toLocaleString() + '건';
  const bar = document.createElement('div'); bar.className='bar'; const bi = document.createElement('i'); bi.style.width = i.score+'%'; bar.append(bi);
  row.append(bd, sc, rv, bar);
  const d = document.createElement('p'); d.className='desc'; d.textContent = i.description;
  el.append(top, row, d);
  const m = (i.source||'').match(/https?:\/\/\S+/);
  if(m){ const a = document.createElement('a'); a.className='src'; a.href=m[0]; a.target='_blank'; a.rel='noopener'; a.textContent='Google 지도에서 보기 ↗'; el.append(a); }
  const art = document.createElement('div'); art.className = 'art'; art.innerHTML = ART[artType(i)];
  wrap.append(el, art);
  return wrap;
}
function render(){
  renderButtons();
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PER));
  if(state.page > pages) state.page = pages;
  const start = (state.page-1)*PER;
  const grid = document.getElementById('grid'); grid.replaceChildren();
  if(!list.length){
    const e = document.createElement('div'); e.className='empty';
    e.textContent = state.fav ? '아직 찜한 곳이 없어요. 카드의 ♡를 눌러 추가해 보세요.' : '검색 결과가 없습니다.';
    grid.append(e);
  } else list.slice(start, start+PER).forEach((i,k) => grid.append(card(i, start+k+1)));
  const label = (state.city==='전체' ? '' : state.city + ' ') + (state.fav ? '찜' : state.cat);
  document.getElementById('meta').textContent = label + ' ' + list.length + '곳 · ' + SORTS[state.sort] + ' · ' + state.page + '/' + pages + ' 페이지 (6개씩)';
  const p = document.getElementById('pager'); p.replaceChildren();
  if(pages > 1){
    const go = (n) => () => { state.page = n; render(); window.scrollTo({top:0, behavior:'smooth'}); };
    const prev = document.createElement('button'); prev.textContent='‹'; prev.disabled = state.page===1; prev.onclick = go(state.page-1); p.append(prev);
    for(let n=1;n<=pages;n++){ const b=document.createElement('button'); b.textContent=n; if(n===state.page) b.className='on'; b.onclick=go(n); p.append(b); }
    const next = document.createElement('button'); next.textContent='›'; next.disabled = state.page===pages; next.onclick = go(state.page+1); p.append(next);
  }
}
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; state.page = 1; render(); });
render();
</script>
</body>
</html>
